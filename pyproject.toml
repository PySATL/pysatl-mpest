[tool.poetry]
name = "pysatl_mpest"
version = "0.1.0"
description = "Parameter estimation of mixture distribution problem solver, based on EM algorithm"
authors = ["ToxaKaz <anton.a.kazancev@gmail.com>", "iraedeus <dtotjmyanin@mail.ru>"]
keywords = ["EM algorithm", "mixture distribution", "parameter estimation"]

license = "LICENSE"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]


[tool.poetry.dependencies]
python = ">=3.12,<3.14"
numpy = ">=2.2.3,<3.0.0"
scipy = ">=1.15.2,<2.0.0"
pysatl-core = "0.1.0a0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-mock = "^3.14.1"
pre-commit = "^4.1.0"
ruff = "^0.9.6"
mypy = "==1.13.0"
hypothesis = "^6.131.7"
pytest-cov = "^7.0.0"
mutmut = "^3.8.0"

[tool.poetry.group.docs.dependencies]
sphinx = "^8.2.3"
myst-parser = "^4.0.1"
sphinxcontrib-mermaid = "^1.0.0"
pydata-sphinx-theme = "^0.16.1"

[tool.ruff]
line-length = 120
output-format = "grouped"
src = ["pysatl_mpest", "tests"]
exclude = ["*.ipynb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["A", "E", "F", "I", "PL", "RUF", "SIM", "UP", "W"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]


[tool.mypy]
files = ["pysatl_mpest"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]

addopts = [
    "--cov=pysatl_mpest",          # Укажите здесь имя вашего основного пакета/папки с кодом
    "--cov-report=term-missing", # Выводить отчет в консоль с указанием пропущенных строк
    "--cov-report=html",         # Генерировать детальный HTML-отчет
    "--cov-fail-under=80",       # Считать запуск тестов проваленным, если покрытие ниже 80%
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mutmut]
source_paths = ["pysatl_mpest"]
only_mutate = [
    "pysatl_mpest/core/mixture.py",
    "pysatl_mpest/core/_components.py",
    "pysatl_mpest/estimators/iterative/_strategies/*.py",
    "pysatl_mpest/estimators/iterative/steps/*.py",
    "pysatl_mpest/estimators/iterative/pipeline.py",
]
# Our default pytest options measure coverage and fail below a threshold, which mutmut does itself in another way.
pytest_add_cli_args = ["-o", "addopts=", "-p", "no:cacheprovider"]
pytest_add_cli_args_test_selection = ["tests"]
